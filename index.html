<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>NYC</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 13px monospace; color: #fff; }
    canvas { display: block; }
    #hud { position: fixed; bottom: 28px; left: 12px; white-space: pre; text-shadow: 0 0 3px #000; font-size: 14px; }
    #attribution { position: fixed; bottom: 0; left: 0; right: 0; padding: 4px 8px; background: rgba(0,0,0,.6); font-size: 11px; }
    #go { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; background: rgba(0,0,0,.6); padding: 8px; border-radius: 8px; }
    #q { width: 420px; padding: 8px 10px; border: 1px solid #555; border-radius: 6px; background: #111; color: #fff; font: inherit; }
    #go button { padding: 8px 14px; border: 0; border-radius: 6px; background: #3478f6; color: #fff; font: inherit; cursor: pointer; }
    #map { position: fixed; right: 16px; bottom: 36px; text-align: center; }
    #minimap { display: block; width: 240px; height: 240px; cursor: crosshair; }
    #mmz { position: absolute; left: 4px; bottom: 22px; display: flex; flex-direction: column; gap: 4px; }
    #mmz button { width: 26px; height: 26px; border: 0; border-radius: 50%; background: rgba(0,0,0,.7); color: #fff; font: 16px monospace; cursor: pointer; }
    #coords { font-size: 11px; padding-top: 4px; text-shadow: 0 0 3px #000; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0b0f14; font-size: 18px; letter-spacing: .02em; z-index: 10; }
  </style>
</head>
<body>
  <form id="go"><input id="q" list="places" placeholder="Address, place, or 40.7580, -73.9855" autocomplete="off" /><datalist id="places"></datalist><button>Go</button></form>
  <div id="map"><canvas id="minimap" width="480" height="480" title="Click to teleport · scroll to zoom"></canvas><div id="mmz"><button id="zin">+</button><button id="zout">−</button></div><div id="coords"></div></div>
  <div id="hud"></div>
  <div id="attribution"></div>
  <div id="loading">Loading…</div>
  <script type="module" src="/main.js"></script>
</body>
</html>
